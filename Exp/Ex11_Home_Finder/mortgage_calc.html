<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mortgage Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container card"><h2>Home Loan & Mortgage EMI Calculator</h2>
<p>Formula: EMI = [P x r x (1+r)^n] / [(1+r)^n - 1]</p>
<div class="form-grid">
<div class="form-group"><label>Loan Amount (Principal - Rs):</label><input type="number" id="p" value="11600000"></div>
<div class="form-group"><label>Annual Interest Rate (%):</label><input type="number" id="r" value="8.5" step="0.1"></div>
<div class="form-group"><label>Tenure (Years):</label><input type="number" id="n" value="20"></div>
</div>
<button class="btn-primary" onclick="calcEMI()">Calculate Monthly EMI</button>
<div id="res" style="margin-top:1.5rem; font-size:1.2rem; font-weight:700; color:#0284c7;">Monthly EMI: Rs. 1,00,742.60</div>
<a href="index.html" class="btn-secondary" style="margin-top:1rem; display:inline-block;">Back to Properties</a>
</div>
<script>
function calcEMI() {
    let p = parseFloat(document.getElementById('p').value);
    let r = (parseFloat(document.getElementById('r').value)/12)/100;
    let n = parseInt(document.getElementById('n').value)*12;
    let emi = (p * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
    document.getElementById('res').innerText = "Monthly EMI: Rs. " + emi.toLocaleString('en-IN', {maximumFractionDigits:2});
}
</script></body></html>
